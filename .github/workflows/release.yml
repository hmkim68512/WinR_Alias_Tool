# v로 시작하는 태그(예: v1.0.0)를 push하면 exe 두 종류를 빌드해서 GitHub Releases에 올린다.
#   - win-x64           : .NET 런타임 포함 (받자마자 실행)
#   - win-x64-framework : 런타임 별도 (작지만 .NET 8 Desktop Runtime 필요)
# Actions 탭에서 수동 실행(workflow_dispatch)하면 릴리스 없이 빌드 결과만 아티팩트로 남긴다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = if ('${{ github.ref_type }}' -eq 'tag') { $tag.TrimStart('v') } else { '0.0.0-dev' }
          $name = if ('${{ github.ref_type }}' -eq 'tag') { $tag } else { 'dev' }
          $common = @('WinRAlias/WinRAlias.csproj', '-c', 'Release', '-r', 'win-x64',
                      '-p:PublishSingleFile=true', '-p:DebugType=none', "-p:Version=$version")

          dotnet publish @common --self-contained true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -o out/win-x64
          dotnet publish @common --self-contained false -o out/win-x64-framework

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive out/win-x64/WinRAlias.exe "dist/WinRAlias-$name-win-x64.zip"
          Compress-Archive out/win-x64-framework/WinRAlias.exe "dist/WinRAlias-$name-win-x64-framework.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WinRAlias
          path: dist/*.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
